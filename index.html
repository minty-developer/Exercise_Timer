<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>운동용 타이머</title>
</head>
<body>
    <div class="loading" id="loading">
        <div class="load_per" id="load_per">로딩중</div>
    </div>

    <header>
        <h1 class="title">운동 타이머</h1>
        <button class="settings" id="settings"><h2>≡</h2></button>
    </header>
    
    <aside class="settingsMenu" id="settingsMenu">
        <button class="close" id="close">X</button>
        <h2>설정</h2>

        <div class="work">
            <p>운동 시간:</p>
            <input type="number" id="workMin">
            <p>분</p>
            <input type="number" id="workSec">
            <p>초</p>
        </div>

        <div class="rest">
            <p>휴식 시간:</p>
            <input type="number" id="restMin">
            <p>분</p>
            <input type="number" id="restSec">
            <p>초</p>
        </div>

        <div class="sets">
            <label for="sets">세트 수:</label>
            <input type="number" id="sets">
            <label for="UnLimitRoop">무한 반복 하기</label>
            <input type="checkbox" id="UnLimitRoop">
        </div>

        <div class="alert_sounds">
            <div class="start_ready_box">
                <label>시작 전 알림: <input type="number" id="start_readySec">초 전 알림</label>
            </div>

            <div class="start_box">
                <label>시작할 때 알림: <input type="range" id="startSound" min="0" max="1"></label>
            </div>

            <div class="ready_box">
                <p>휴식 종료 전 알림:</p>
                <label>알림 켜기: <input type="range" id="readySound" min="0" max="1"></label>
                <label><input type="number" id="readySec">초 전 알림</label>
            </div>
        </div>

        <button id="save_button">저장</button>
    </aside>

    <main>
        <h2 id="condition">로딩 중...</h2>
        <div class="timer">
            <h2 id="minute">00</h2>
            <h2>:</h2>
            <h2 id="second">00</h2>
        </div>

        <div class="buttons">
            <button id="start">시작</button>
            <button id="stop">정지</button>
            <button id="reset">초기화</button>
        </div>
    </main>

    <script src="./script.js"></script>
</body>
</html>
