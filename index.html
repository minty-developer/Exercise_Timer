<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>운동 타이머 | 준비 중</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <main class="loading" id="loading">
        <div class="loading_panel">
            <p class="loading_eyebrow">EXERCISE TIMER</p>
            <h1>오늘의 운동을<br><span>준비하고 있어요</span></h1>
            <p class="loading_description">설정과 타이머 화면을 불러오는 중입니다.</p>

            <div class="loading_status" aria-live="polite">
                <span class="status_dot"></span>
                <span id="load_per">서버에 연결하는 중...</span>
            </div>
            <div class="loading_progress" role="progressbar" aria-label="로딩 진행률" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                <span id="loading_progress_bar"></span>
            </div>
            <p class="loading_detail" id="loading_detail">Render 서버가 깨어나는 데 잠시 걸릴 수 있어요.</p>

            <div class="loading_features">
                <span>WORK</span>
                <span>REST</span>
                <span>REPEAT</span>
            </div>
        </div>
    </main>
    <script src="./index.js"></script>
</body>
</html>
