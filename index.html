<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>운동용 타이머</title>
</head>
<body>
    <div class="loading" id="loading">
        <div class="load_per" id="load_per">로딩중</div>
    </div>

    <header>
        <h1 class="title">운동 타이머</h1>
        <button class="settings" id="settings"><h2>≡</h2></button>
    </header>
    
    <aside class="settingsMenu" id="settingsMenu">
        <button class="close" id="close">X</button>
        <h2>설정</h2>

        <div class="work">
            <p><strong>운동 시간:</strong></p>
            <div>
                <label class="time_label"><input type="number" id="workMin" class="time">분</label>
                <label class="time_label"><input type="number" id="workSec" class="time">초</label>
            </div>
        </div>

        <div class="rest">
            <p><strong>휴식 시간:</strong></p>
            <div>
                <label class="time_label"><input type="number" id="restMin" class="time">분</label>
                <label class="time_label"><input type="number" id="restSec" class="time">초</label>
            </div>
        </div>

        <div class="sets">
            <p><strong>세트 수: </strong></p>
            <label><input type="number" id="sets" class="sets_input">회</label>
            <label><input type="checkbox" id="UnLimitRoop"> 무한 반복 하기</label>
        </div>

        <div class="alert_sounds">
            <div class="start_ready_box">
                <p><strong>시작 전 알림: </strong></p>
                <label><input type="number" class="before_start" id="start_readySec">초 전 알림</label>
            </div>

            <div class="start_box">
                <p><strong>시작할 때 알림: </strong></p>
                <label>(끄기)<input class="bar" type="range" id="startSound" min="0" max="1">(켜기)</label>
            </div>

            <div class="ready_box">
                <p><strong>휴식 종료 전 알림:</strong></p>
                <label>(끄기)<input class="bar" type="range" id="readySound" min="0" max="1">(켜기)</label>
                <label><input class="ready" type="number" id="readySec">초 전 알림</label>
            </div>
        </div>

        <button class="save_button" id="save_button">저장</button>
    </aside>

    <main>
        <h2 id="condition">로딩 중...</h2>
        <div class="timer">
            <h2 id="minute">00</h2>
            <h2>:</h2>
            <h2 id="second">00</h2>
        </div>

        <div class="buttons">
            <button id="start">시작</button>
            <button id="stop">정지</button>
            <button id="reset">초기화</button>
        </div>
    </main>

    <script src="./script.js"></script>
</body>
</html>
